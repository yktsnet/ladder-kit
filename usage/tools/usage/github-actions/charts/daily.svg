.other { stroke: var(--muted); fill: var(--muted); }
.limit { stroke: var(--alert); stroke-width: 1.5; stroke-dasharray: 4 3; } .limit-text { fill: var(--alert); font-size: 11px; }
.s0 { stroke: var(--s0); fill: var(--s0); }
